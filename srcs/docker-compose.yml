                #      smart_contract:
                #        driver: local
                #        driver_opts:
                #          type: 'none'
                #          o: 'bind'
                #          device: "../volume/smart_contract"
        redis:
          image: redis:6-alpine
          container_name: redis
          restart: always
          networks:
            - network
          hostname: redis

    networks:
      network:
        driver: bridge

    volumes:
      app:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/django_web_app"
      static:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/static"
      postgresql:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/postgresql"
      nextjs:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/nextjs"
      pong_backend:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/pong_backend"
      


