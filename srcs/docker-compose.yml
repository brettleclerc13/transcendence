    services:
        postgresql:
          build:
            context: ./requirements/postgresql
            dockerfile: Dockerfile
          image: postgres:16.4
          container_name: postgresql
          env_file: .env
          init: true
          restart: always
          networks:
            - network
          hostname: postgresql
          volumes:
              - "postgresql:/var/lib/postgresql"

        reactjs:
          build:
            context: ./requirements/reactjs
            dockerfile: Dockerfile
          image: reactjs
          container_name: reactjs
          env_file: .env
          init: true
          restart: always
          ports:
            - "3000:3000"
          #networks:
          #  - network
          hostname: reactjs
          #volumes:
          #    - "postgresql:/var/lib/postgresql"

        app:
          depends_on:
              - postgresql
              - reactjs
          build:
            context: ./requirements/app
            dockerfile: Dockerfile
          image: python:3.13.0rc1
          container_name: app
          env_file: .env
          init: true
          restart: always
          networks:
            - network
          hostname: app
          volumes:
              - "app:/django_web_app"
              - "static:/static"

        nginx:
          depends_on:
              - app
          build:
            context: ./requirements/nginx
            dockerfile: Dockerfile
          ports:
            - "443:443/tcp"
          image: nginx:1.27.1
          container_name: nginx
          env_file: .env
          init: true
          restart: always
          networks:
            - network
          hostname: nginx
          volumes:
              - "static:/static"

                #        smart_contract:
                #          depends_on:
                #              - postgresql
                #          build:
                #            context: ./requirements/smart_contract
                #            dockerfile: Dockerfile
                #          image: solidity:10.11.6
                #          container_name: smart_contract
                #          env_file: .env
                #          init: true
                #          restart: always
                #          hostname: smart_contract
                #          volumes:
                #              - "smart_contract:/projects"

                #    volumes:
                #      smart_contract:
                #        driver: local
                #        driver_opts:
                #          type: 'none'
                #          o: 'bind'
                #          device: "../volume/smart_contract"

    networks:
      network:
        driver: bridge

    volumes:
      app:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/django_web_app"
      static:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/static"
      postgresql:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/postgresql"
