    networks:
      network:
        driver: bridge
        ipam:
          config:
            - subnet: 172.18.0.0/24

    volumes:
      nextjs:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/nextjs"
      static_service_app:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/static/static_service_app"
      service_app_django:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/service_app/django"
      service_app_postgresql:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/service_app/postgresql"
      static_service_chat:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/static/static_service_chat"
      service_chat_django:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/service_chat/django"
      service_chat_postgresql:
        driver: local
        driver_opts:
          type: 'none'
          o: 'bind'
          device: "../volume/service_chat/postgresql"
